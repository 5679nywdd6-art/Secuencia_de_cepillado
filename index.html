<style>
  :root{
    /* --- paleta de marca --- */
    --noche:      #070a1d;
    --noche-alta: #16203f;
    --noche-baja: #04050f;
    --cian:       #01cefe;
    --magenta:    #f5296f;
    --azul-claro: #b9d4f2;
    --tiza:       #eaeef7;
    --tinta:      #0b0f22;
    --degradado:  linear-gradient(100deg,#01cefe 0%,#2f7bf2 34%,#7b3bd6 63%,#f5296f 100%);
    /* variante aclarada: la usa cualquier superficie con texto u objeto oscuro encima */
    --degradado-claro: linear-gradient(100deg,#42d9ff 0%,#5aa6ff 40%,#ff5c9d 100%);
    --linea:      rgba(234,238,247,.38);
  }

  *{ box-sizing:border-box; }

  html{ font-size:24px; height:100%; }

  body{
    margin:0; height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:radial-gradient(130% 110% at 50% -10%,
               var(--noche-alta) 0%, var(--noche) 55%, var(--noche-baja) 100%);
    color:var(--tiza);
    font-family:"Avenir Next","Futura",Bahnschrift,"Segoe UI Variable Display",
                "Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  #app{
    height:100vh; height:100dvh;
    display:grid; grid-template-rows:auto 1fr;
  }

  /* ---------- barra ---------- */
  #barra{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    gap:1.5rem;
    padding:.7rem 1.1rem .8rem;
  }
  #barra::after{                       /* filete de marca */
    content:'';
    position:absolute; left:0; right:0; bottom:0;
    height:3px;
    background:var(--degradado);
  }

  #marca{ display:flex; align-items:center; gap:.8rem; min-width:0; }
  #marca img{
    width:2.4rem; height:2.4rem;
    border-radius:.5rem;
    display:block; flex:none;
  }
  #titulo{
    margin:0;
    font-size:1.35rem; font-weight:700;
    letter-spacing:-.012em;
    line-height:1.15;
  }

  #controles{ display:flex; gap:.5rem; flex:none; }

  .icono{
    width:3rem; height:3rem;
    display:grid; place-items:center;
    padding:0;
    color:var(--tiza); background:transparent;
    border:1px solid var(--linea); border-radius:.6rem;
    cursor:pointer; touch-action:manipulation;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .icono svg{ width:1.5rem; height:1.5rem; display:block; }
  .icono:hover{ background:rgba(234,238,247,.1); border-color:rgba(234,238,247,.6); }
  .icono:focus-visible{ outline:3px solid var(--cian); outline-offset:3px; }
  .icono.activo{
    color:var(--noche);
    border-color:transparent;
    background:var(--degradado-claro);
  }

  /* ---------- escenario ---------- */
  #escenario{
    position:relative;
    overflow:hidden;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }

  .region{
    position:absolute;
    border:.2rem solid rgba(128,170,218,.5);
    border-radius:1rem;
    background:rgba(128,170,218,.07);
    pointer-events:none;              /* nunca captura ni interfiere */
  }
  .region > span{
    position:absolute; top:.65rem; left:50%; transform:translateX(-50%);
    font-size:1.15rem; font-weight:700; letter-spacing:-.005em;
    color:var(--azul-claro);
    white-space:nowrap;
  }

  .carta{
    touch-action:none;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:.75rem .6rem;
    min-height:3.2rem; max-width:min(15rem,18vw);
    border:.18rem solid transparent;
    border-radius:.7rem;
    background:
      linear-gradient(var(--tiza),var(--tiza)) padding-box,
      linear-gradient(rgba(234,238,247,.22),rgba(234,238,247,.22)) border-box;
    color:var(--tinta);
    box-shadow:0 .2rem .7rem rgba(0,0,0,.5);
    font-size:1.05rem; font-weight:700; line-height:1.2;
    letter-spacing:-.005em;
    cursor:grab;
    transition:box-shadow .14s ease, background .14s ease, transform .14s ease;
  }
  .pieza{
    position:absolute;
    transform:translate(-50%,-50%);
  }

  .carta figure{
    margin:0; display:flex; flex-direction:column; align-items:center; gap:.35rem;
    width:100%; height:100%;
  }
  .carta .lamina{
    width:100%; height:5rem; flex:none;   /* altura fija: la anchura no altera el alto */
    display:flex; align-items:center; justify-content:center;
  }
  .carta .lamina svg,
  .carta .lamina img{
    display:block; width:100%; height:100%;
    object-fit:contain;
    border-radius:.4rem;
    pointer-events:none;
  }
  .carta figcaption{
    font-size:.8rem; font-weight:700; line-height:1.15;
    flex:1; width:100%; overflow:hidden;   /* el pie ocupa el resto: alturas iguales */
    display:flex; align-items:center; justify-content:center;
  }
  .carta.solo-lamina{ padding:.4rem; }

  /* ---------- eje temporal ---------- */
  #eje{
    position:absolute; left:4%; right:4%;
    height:.3rem; border-radius:.15rem;
    background:var(--degradado);
    pointer-events:none;
  }
  #eje::after{
    content:''; position:absolute; right:-.7rem; top:50%;
    transform:translateY(-50%);
    border-left:.95rem solid var(--magenta);
    border-top:.6rem solid transparent;
    border-bottom:.6rem solid transparent;
  }
  #eje .extremo{
    position:absolute; top:.7rem;
    font-size:1.05rem; font-weight:700; letter-spacing:-.005em;
    color:var(--azul-claro); white-space:nowrap;
  }
  #eje.iman-activo{
    height:.45rem;
    box-shadow:0 0 1.4rem rgba(1,206,254,.7);
  }
  #eje .izq{ left:0; }
  #eje .der{ right:0; }

  .carta.destacada,
  .carta:focus-visible{
    outline:none;
    border-width:.3rem;
    background:
      linear-gradient(var(--tiza),var(--tiza)) padding-box,
      var(--degradado) border-box;
    box-shadow:0 .25rem .8rem rgba(0,0,0,.55),
               0 0 2.2rem rgba(1,206,254,.55),
               0 0 4.5rem rgba(245,41,111,.35);
  }
  .pieza.destacada,
  .pieza:focus-visible{ transform:translate(-50%,-50%) scale(1.06); }

  /* ---------- paleta de plantillas y papelera ---------- */
  #paleta{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; justify-content:center; align-items:stretch;
    gap:.6rem;
    padding:.7rem 1rem;
    background:rgba(4,5,15,.78);
    border-top:1px solid rgba(234,238,247,.22);
  }
  .plantilla{ position:relative; flex:none; cursor:copy; }

  #papelera{
    flex:none; margin-left:1.4rem;
    width:var(--ancho-ficha,8rem); align-self:stretch;
    display:grid; place-items:center;
    padding:0;
    color:var(--tiza); background:transparent;
    border:.16rem dashed rgba(234,238,247,.55); border-radius:.8rem;
    cursor:pointer; touch-action:manipulation;
    transition:background .12s ease, border-color .12s ease, color .12s ease;
  }
  #papelera svg{ width:2.6rem; height:2.6rem; }
  #papelera:hover{ background:rgba(234,238,247,.1); }
  #papelera:focus-visible{ outline:3px solid var(--cian); outline-offset:3px; }
  #papelera.sobre{
    color:#fff; border-style:solid; border-color:transparent;
    background:var(--magenta);
  }

  .pieza.asentando{ transition:left .18s ease, top .18s ease; }
  .pieza.vecina{
    box-shadow:0 .25rem .8rem rgba(0,0,0,.55), 0 0 1.5rem rgba(1,206,254,.6);
  }

  .pieza.moviendo{
    cursor:grabbing;
    box-shadow:0 1.1rem 2.2rem rgba(0,0,0,.6);
    transition:none;
  }

  @media (prefers-reduced-motion:reduce){ *{ transition-duration:.01ms !important; } }
</style>
</head>

<body>
<div id="app">

(function(){
  'use strict';

  var escenario = document.getElementById('escenario');
  var titulo    = document.getElementById('titulo');
  var btnTamano = document.getElementById('tamano');
  var btnPantalla = document.getElementById('pantalla');

  var capa = 10;

  /* ---- escala según el tamaño real del panel, ajustable en el aula ---- */
  var FACTORES = [1, 1.25, 1.5];
  var factor = 0;

  function escalar(){
    var f = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    var px = Math.max(16, Math.min(30, 24 * f)) * FACTORES[factor];
    document.documentElement.style.fontSize = px + 'px';
  }
  window.addEventListener('resize', function(){ escalar(); calcularLimite(); });
  escalar();

  /* ---- montaje ---- */
  var paleta = null, papelera = null, eje = null, limiteY = 96;

  function crearCarta(p, i){
    var b = document.createElement('div');
    b.className = 'carta';
    var lamina = p.svg
      ? '<span class="lamina">' + p.svg + '</span>'
      : (p.imagen ? '<span class="lamina"><img src="' + p.imagen + '" alt=""></span>' : '');

    if (lamina){
      b.style.width  = (p.ancho || CONFIG.ancho || 8) + 'rem';
      b.style.height = (CONFIG.alto || 10.2) + 'rem';   // igual para todas
      b.innerHTML = '<figure>' + lamina + (p.texto ? '<figcaption></figcaption>' : '') + '</figure>';
      if (p.texto) b.querySelector('figcaption').textContent = p.texto;
      else b.classList.add('solo-lamina');
    } else {
      b.textContent = p.texto;
    }
    b.setAttribute('aria-label', p.texto || 'Tarjeta ' + (i + 1));
    b.tabIndex = 0;
    return b;
  }

  function ordenInicial(total){
    var o = [];
    for (var i = 0; i < total; i++) o.push(i);
    if (CONFIG.mezclar){
      for (var k = o.length - 1; k > 0; k--){
        var j = Math.floor(Math.random() * (k + 1));
        var t = o[k]; o[k] = o[j]; o[j] = t;
      }
    }
    return o;
  }

  function montar(){
    titulo.textContent = CONFIG.titulo;
    document.title = CONFIG.titulo + ' \u00b7 +Qp';
    escenario.innerHTML = '';
    escenario.style.backgroundImage = CONFIG.fondo ? 'url("' + CONFIG.fondo + '")' : '';
    paleta = null; papelera = null; eje = null; limiteY = 96;
    capa = 10;

    if (CONFIG.eje){
      var ej = document.createElement('div');
      eje = ej;
      ej.id = 'eje';
      ej.style.top = CONFIG.eje.y + '%';
      escenario.appendChild(ej);
      if (CONFIG.eje.desde){
        var iz = document.createElement('span'); iz.className = 'extremo izq';
        iz.textContent = CONFIG.eje.desde; ej.appendChild(iz);
      }
      if (CONFIG.eje.hasta){
        var de = document.createElement('span'); de.className = 'extremo der';
        de.textContent = CONFIG.eje.hasta; ej.appendChild(de);
      }
    }

    (CONFIG.regiones || []).forEach(function(r){
      var d = document.createElement('div');
      d.className = 'region';
      d.style.left = r.x + '%';      d.style.top = r.y + '%';
      d.style.width = r.ancho + '%'; d.style.height = r.alto + '%';
      if (r.etiqueta){
        var s = document.createElement('span');
        s.textContent = r.etiqueta;
        d.appendChild(s);
      }
      escenario.appendChild(d);
    });

    var total = CONFIG.piezas.length;
    var orden = ordenInicial(total);

    if (CONFIG.duplicar){
      paleta = document.createElement('div');
      paleta.id = 'paleta';
      paleta.style.setProperty('--ancho-ficha', (CONFIG.ancho || 8) + 'rem');
      orden.forEach(function(idx){
        var b = crearCarta(CONFIG.piezas[idx], idx);
        b.classList.add('plantilla');
        b.addEventListener('pointerdown', alPulsarPlantilla);
        b.addEventListener('keydown', function(ev){
          if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); copiarAlTablero(b); }
        });
        paleta.appendChild(b);
      });
      papelera = crearPapelera();
      paleta.appendChild(papelera);
      escenario.appendChild(paleta);
    } else {
      orden.forEach(function(idx, pos){
        var p = CONFIG.piezas[idx];
        var b = crearCarta(p, idx);
        b.classList.add('pieza');
        var porFila = Math.min(total, CONFIG.porFila || 5);
        var filas = Math.ceil(total / porFila);
        var fila = Math.floor(pos / porFila);
        var col  = pos % porFila;
        var enFila = Math.min(porFila, total - fila * porFila);
        b.dataset.x = (p.x !== undefined) ? p.x : ((col + 0.5) * (100 / enFila));
        b.dataset.y = (p.y !== undefined) ? p.y : (100 - (filas - fila) * 21 + 2);
        situar(b);
        activar(b);
        escenario.appendChild(b);
      });
    }
  }

  function crearPapelera(){
    var t = document.createElement('button');
    t.id = 'papelera'; t.type = 'button';
    t.setAttribute('aria-label', 'Eliminar las tarjetas destacadas');
    t.title = 'Papelera';
    t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M3 6h18"/><path d="M8 6V4h8v2"/>' +
      '<path d="M6 6l1 14a2 2 0 002 2h6a2 2 0 002-2l1-14"/>' +
      '<path d="M10 11v6"/><path d="M14 11v6"/></svg>';
    t.addEventListener('click', function(){
      var fuera = escenario.querySelectorAll('.copia.destacada');
      Array.prototype.forEach.call(fuera, function(c){ c.remove(); });
    });
    return t;
  }

  function activar(b){
    b.addEventListener('pointerdown', alPulsar);
    b.addEventListener('keydown', alTeclear);
  }

  function situar(b){
    b.style.left = b.dataset.x + '%';
    b.style.top  = b.dataset.y + '%';
  }

  /* ---- una plantilla de la paleta genera una copia libre ---- */
  function copiaDe(plantilla, xPct, yPct){
    var c = plantilla.cloneNode(true);
    c.classList.remove('plantilla', 'destacada');
    c.classList.add('pieza', 'copia');
    c.dataset.x = Math.max(3, Math.min(97, xPct)).toFixed(2);
    c.dataset.y = Math.max(4, Math.min(limiteY, yPct)).toFixed(2);
    c.style.zIndex = ++capa;
    situar(c);
    activar(c);
    escenario.appendChild(c);
    return c;
  }

  function copiarAlTablero(plantilla){
    var r = escenario.getBoundingClientRect();
    var c = plantilla.getBoundingClientRect();
    calcularLimite();
    copiaDe(plantilla,
            (c.left + c.width / 2 - r.left) / r.width * 100,
            limiteY - 8);
  }

  /* ---- imán del eje: al soltar cerca, las tarjetas se alinean a una misma altura.
         Es reversible: basta volver a arrastrarlas fuera de la banda. ---- */
  function datosIman(pieza){
    if (!eje || !CONFIG.eje || CONFIG.eje.iman === false) return null;
    var r = escenario.getBoundingClientRect();
    var t = pieza.getBoundingClientRect();
    var alto = t.height / r.height * 100;
    return {
      carril: CONFIG.eje.y - alto / 2 - 2,          // 2 % de aire sobre la línea
      tolerancia: Math.max(6, alto * 0.55)
    };
  }

  /* ---- imán lateral: al soltar junto a otra tarjeta, se alinean en altura y
         quedan separadas por una holgura fija. También es reversible. ---- */
  function medidas(pieza){
    var r = escenario.getBoundingClientRect();
    var t = pieza.getBoundingClientRect();
    var raiz = parseFloat(getComputedStyle(document.documentElement).fontSize);
    return {
      ancho: t.width  / r.width  * 100,
      alto:  t.height / r.height * 100,
      sep:   (CONFIG.separacion !== undefined ? CONFIG.separacion : .35) * raiz / r.width * 100
    };
  }

  function vecindad(pieza, m){
    if (!m || CONFIG.imanLateral === false) return null;
    var x = parseFloat(pieza.dataset.x), y = parseFloat(pieza.dataset.y);
    var paso = m.ancho + m.sep;
    var libres = escenario.querySelectorAll('.pieza');
    var mejor = null, i, o, oy, ox, lado, cand, d;

    for (i = 0; i < libres.length; i++){
      o = libres[i];
      if (o === pieza) continue;
      oy = parseFloat(o.dataset.y);
      if (Math.abs(oy - y) > m.alto * 0.6) continue;      // no están a la misma altura
      ox = parseFloat(o.dataset.x);
      for (lado = -1; lado <= 1; lado += 2){
        cand = ox + lado * paso;
        d = Math.abs(x - cand);
        if (d <= m.ancho * 0.65 && (!mejor || d < mejor.d)){
          mejor = { x:cand, y:oy, d:d, vecina:o };
        }
      }
    }
    if (!mejor) return null;

    for (i = 0; i < libres.length; i++){          // descartar si el hueco ya está ocupado
      o = libres[i];
      if (o === pieza) continue;
      if (Math.abs(parseFloat(o.dataset.x) - mejor.x) < m.ancho * 0.6 &&
          Math.abs(parseFloat(o.dataset.y) - mejor.y) < m.alto  * 0.6) return null;
    }
    mejor.x = Math.max(3, Math.min(97, mejor.x));
    return mejor;
  }

  function asentar(p){
    p.classList.add('asentando');
    situar(p);
    setTimeout(function(){ p.classList.remove('asentando'); }, 220);
  }

  function calcularLimite(){
    if (!paleta){ limiteY = 96; return; }
    var r = escenario.getBoundingClientRect();
    var p = paleta.getBoundingClientRect();
    limiteY = Math.max(20, (1 - p.height / r.height) * 100 - 3);
  }

  function alPulsarPlantilla(ev){
    var plantilla = ev.currentTarget;
    if (arrastres.has(ev.pointerId)) return;
    calcularLimite();

    var r = escenario.getBoundingClientRect();
    var c = plantilla.getBoundingClientRect();
    var copia = copiaDe(plantilla,
                        (c.left + c.width / 2 - r.left) / r.width * 100,
                        (c.top + c.height / 2 - r.top) / r.height * 100);

    try { copia.setPointerCapture(ev.pointerId); } catch(e){}
    arrastres.set(ev.pointerId, {
      pieza:copia, nacida:true, iman:datosIman(copia), medidas:medidas(copia),
      dx:ev.clientX - (c.left + c.width / 2),
      dy:ev.clientY - (c.top + c.height / 2),
      x0:ev.clientX, y0:ev.clientY,
      movido:false,
      caja:papelera ? papelera.getBoundingClientRect() : null
    });
    copia.addEventListener('pointermove', alMover);
    copia.addEventListener('pointerup', alSoltar);
    copia.addEventListener('pointercancel', alSoltar);
  }

  function alPulsar(ev){
    var p = ev.currentTarget;
    if (arrastres.has(ev.pointerId)) return;

    var c = p.getBoundingClientRect();
    p.style.zIndex = ++capa;
    calcularLimite();
    try { p.setPointerCapture(ev.pointerId); } catch(e){}

    arrastres.set(ev.pointerId, {
      pieza:p,
      iman:datosIman(p),
      medidas:medidas(p),
      caja:papelera ? papelera.getBoundingClientRect() : null,
      dx:ev.clientX - (c.left + c.width / 2),
      dy:ev.clientY - (c.top + c.height / 2),
      x0:ev.clientX, y0:ev.clientY,
      movido:false
    });
    p.addEventListener('pointermove', alMover);
    p.addEventListener('pointerup', alSoltar);
    p.addEventListener('pointercancel', alSoltar);
  }

  function alMover(ev){
    var e = arrastres.get(ev.pointerId);
    if (!e) return;
    if (!e.movido){
      if (Math.abs(ev.clientX - e.x0) < 8 && Math.abs(ev.clientY - e.y0) < 8) return;
      e.movido = true;
      e.pieza.classList.add('moviendo');
    }
    var r = escenario.getBoundingClientRect();
    var x = ((ev.clientX - e.dx) - r.left) / r.width  * 100;
    var y = ((ev.clientY - e.dy) - r.top)  / r.height * 100;
    e.pieza.dataset.x = Math.max(3, Math.min(97, x)).toFixed(2);
    e.pieza.dataset.y = Math.max(4, Math.min(97, y)).toFixed(2);
    situar(e.pieza);

    if (e.caja && papelera){
      papelera.classList.toggle('sobre', sobrePapelera(e));
    }
    if (e.iman && eje){
      eje.classList.toggle('iman-activo',
        Math.abs(parseFloat(e.pieza.dataset.y) - e.iman.carril) <= e.iman.tolerancia);
    }

    var v = vecindad(e.pieza, e.medidas);
    if (e.vecina && e.vecina !== (v && v.vecina)) e.vecina.classList.remove('vecina');
    e.vecina = v ? v.vecina : null;
    if (e.vecina) e.vecina.classList.add('vecina');
  }

  /* la papelera se activa si la TARJETA la toca, no solo el dedo:
     en un panel táctil apuntar con la tarjeta es mucho más fiable */
  function sobrePapelera(e){
    var c = e.caja;
    if (!c) return false;
    var t = e.pieza.getBoundingClientRect();
    return t.right > c.left && t.left < c.right && t.bottom > c.top && t.top < c.bottom;
  }

  function alSoltar(ev){
    var e = arrastres.get(ev.pointerId);
    if (!e) return;
    arrastres.delete(ev.pointerId);
    var p = e.pieza;
    p.removeEventListener('pointermove', alMover);
    p.removeEventListener('pointerup', alSoltar);
    p.removeEventListener('pointercancel', alSoltar);
    try { p.releasePointerCapture(ev.pointerId); } catch(err){}
    p.classList.remove('moviendo');

    if (papelera) papelera.classList.remove('sobre');
    if (papelera && p.classList.contains('copia') && sobrePapelera(e)){
      p.remove();
      return;
    }
    if (eje) eje.classList.remove('iman-activo');
    if (e.vecina) e.vecina.classList.remove('vecina');

    if (e.iman && Math.abs(parseFloat(p.dataset.y) - e.iman.carril) <= e.iman.tolerancia){
      p.dataset.y = e.iman.carril.toFixed(2);
      asentar(p);
    }

    var v = vecindad(p, e.medidas);               // encaje lateral, tras el vertical
    if (v){
      p.dataset.x = v.x.toFixed(2);
      p.dataset.y = v.y.toFixed(2);
      asentar(p);
    }
    else if (paleta && parseFloat(p.dataset.y) > limiteY){   // no se queda tras la paleta
      p.dataset.y = limiteY.toFixed(2);
      situar(p);
    }
    if (!e.movido && !e.nacida) p.classList.toggle('destacada');
  }

  function alTeclear(ev){
    var p = ev.currentTarget;
    var paso = ev.shiftKey ? 5 : 1;
    var x = parseFloat(p.dataset.x), y = parseFloat(p.dataset.y);
    if (ev.key === 'ArrowLeft')       x -= paso;
    else if (ev.key === 'ArrowRight') x += paso;
    else if (ev.key === 'ArrowUp')    y -= paso;
    else if (ev.key === 'ArrowDown')  y += paso;
    else if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); p.classList.toggle('destacada'); return; }
    else if ((ev.key === 'Delete' || ev.key === 'Backspace') && p.classList.contains('copia')){
      ev.preventDefault(); p.remove(); return;
    }
    else return;
    ev.preventDefault();
    p.dataset.x = Math.max(3, Math.min(97, x)).toFixed(2);
    p.dataset.y = Math.max(4, Math.min(96, y)).toFixed(2);
    p.style.zIndex = ++capa;
    situar(p);
  }

  btnTamano.addEventListener('click', function(){
    factor = (factor + 1) % FACTORES.length;
    btnTamano.classList.toggle('activo', factor > 0);
    btnTamano.setAttribute('aria-label', 'Tamaño de los elementos: ×' + FACTORES[factor]);
    escalar();
  });

  document.getElementById('reiniciar').addEventListener('click', montar);

  btnPantalla.addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });

  document.addEventListener('fullscreenchange', function(){
    var dentro = !!document.fullscreenElement;
    btnPantalla.classList.toggle('activo', dentro);
    btnPantalla.setAttribute('aria-label', dentro ? 'Salir de pantalla completa' : 'Pantalla completa');
    btnPantalla.title = dentro ? 'Salir de pantalla completa' : 'Pantalla completa';
    btnPantalla.innerHTML = dentro
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h5V4"/><path d="M20 9h-5V4"/><path d="M4 15h5v5"/><path d="M20 15h-5v5"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3H4v5"/><path d="M15 3h5v5"/><path d="M9 21H4v-5"/><path d="M15 21h5v-5"/></svg>';
  });

  function mantenerDespierto(){
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function(){});
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') mantenerDespierto();
  });
  document.addEventListener('pointerdown', mantenerDespierto, { once:true });

  if (location.protocol !== 'file:' && 'serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }

  montar();
})();
</script>
</body>
</html>
